ShortDescription: A local-first net-worth and financial-independence tracker.
Description: |-
  Thingary is a local-first desktop app for periodic net-worth check-ins and financial-independence planning. Record balances and debts across accounts, see how net worth changes, and estimate how much to save each month and when work becomes optional. It includes account check-ins, goals and projections, income and spending records, reviews, and optional belongings records. Unknown amounts stay unknown rather than becoming zero. No account or cloud service is required; data stays on the device. The interface is currently Simplified Chinese only.

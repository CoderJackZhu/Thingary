[package]
name = "possio"
version = "0.0.1"
edition = "2021"
default-run = "possio"

[lib]
name = "possio_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

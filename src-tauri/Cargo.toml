[package]
name = "possio"
version = "0.0.1"
edition = "2021"
default-run = "possio"

[lib]
name = "possio_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4.3"
tempfile = "3"

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

zip = { version = "8.6.0", default-features = false }

[features]
fault-injection = []

# Rust 1.96 + macOS 27 can emit unloadable stripped proc-macro dylibs.
# Preserve build-time dependency debug info; the application still uses release optimization.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
debug = true
strip = false

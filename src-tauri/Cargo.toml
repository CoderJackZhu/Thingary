[package]
name = "thingary"
version = "0.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "物谱 Thingary: a local-first macOS archive for possessions and financial net worth"
default-run = "thingary"

[lib]
name = "thingary_lib"
crate-type = ["lib"]

[build-dependencies]
cc = "=1.4.7"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = "0.4.45"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
unicode-normalization = "=0.1.25"
fs2 = "0.4.3"
tempfile = "3"

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

zip = { version = "8.6.0", default-features = false }

[features]
fault-injection = []

# Rust 1.96 + macOS 27 can emit unloadable stripped proc-macro dylibs.
# Preserve build-time dependency debug info; the application still uses release optimization.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
debug = true
strip = false

# Image decoding and hashing are unusably slow unoptimized; this keeps dev
# previews responsive and large-backup tests in seconds, not minutes.
[profile.dev.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
image-webp = { opt-level = 3 }
sha2 = { opt-level = 3 }
zip = { opt-level = 3 }

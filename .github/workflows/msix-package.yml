name: Microsoft Store MSIX candidate

# Produces an UNSIGNED x64 MSIX for Partner Center, plus a static structural
# verification report. It never signs, installs or launches the application and
# never creates a Release or uploads to the Store.
#
# The Microsoft Store re-signs the uploaded package after certification. A
# self-signed test package is only for a real Windows 11 machine; see
# docs/RELEASING.md#microsoft-store.
#
# Partner Center identity defaults live in scripts/pack-msix.ps1. Optional
# repository variables of the same names can override them; empty variables are
# treated as unset here so the reserved defaults stay in force.
on:
  # Also dry-runs when a pull request touches the packaging files, so a broken script is caught before a release tag.
  pull_request:
    paths:
      - 'packaging/msix/**'
      - 'scripts/pack-msix.ps1'
      - 'scripts/prepare-windows.mjs'
      - '.github/workflows/msix-package.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已有标签（例如 v0.1.0），从该标签构建；留空则使用当前分支
        required: false

permissions:
  contents: read

concurrency:
  group: msix-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  msix:
    name: Unsigned x64 MSIX
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      npm_config_script_shell: bash
    steps:
      - name: Preserve LF
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Parse MSIX packaging PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/pack-msix.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'PowerShell syntax validation failed: scripts/pack-msix.ps1' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(node -p "require('./package.json').version")
            if [ "$TAG" != "v$version" ]; then
              echo "::error::Tag $TAG does not match package.json version $version."
              exit 1
            fi
          else
            echo "::notice::Building an MSIX candidate from $GITHUB_REF_NAME; no tag was supplied."
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: msix
          cache-on-failure: true
      - shell: bash
        run: npm ci
      - name: Prepare locked crate sources for offline license collection
        shell: bash
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Export optional Partner Center identity overrides
        shell: bash
        env:
          PARTNER_CENTER_IDENTITY_NAME: ${{ vars.PARTNER_CENTER_IDENTITY_NAME }}
          PARTNER_CENTER_PUBLISHER: ${{ vars.PARTNER_CENTER_PUBLISHER }}
          PARTNER_CENTER_PUBLISHER_DISPLAY_NAME: ${{ vars.PARTNER_CENTER_PUBLISHER_DISPLAY_NAME }}
        run: |
          for name in PARTNER_CENTER_IDENTITY_NAME PARTNER_CENTER_PUBLISHER PARTNER_CENTER_PUBLISHER_DISPLAY_NAME; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done
      - name: Build the release payload without a bundle
        shell: bash
        run: >-
          npm run tauri -- build
          --config src-tauri/tauri.release.conf.json
          --config src-tauri/tauri.windows.release.conf.json
          --no-bundle
          --target x86_64-pc-windows-msvc
          --ci
      - name: Prepare MSIX license notices
        shell: bash
        run: >-
          node scripts/prepare-windows.mjs
          --identity local.thingary.main
          --output .local/distribution/msix-notices
          --packaging msix
      - name: Pack and statically validate the unsigned MSIX
        shell: pwsh
        run: pwsh -NoProfile -File scripts/pack-msix.ps1 -NoticesDir .local/distribution/msix-notices -OutputDir .local/msix
      - name: Save the MSIX, checksum and verification report
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned-x64-${{ github.sha }}
          path: |
            .local/msix/*.msix
            .local/msix/SHA256SUMS.txt
            .local/msix/msix-verification.json
            .local/msix/AppxManifest.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

name: Product website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - 'docs/USER_GUIDE.md'
      - 'docs/QUICKSTART.md'
      - 'scripts/build-site.mjs'
      - 'scripts/guide-renderer.mjs'
      - 'tests/site-guide.test.mjs'
      - 'tests/site-calc.test.mjs'
      - 'src/planning-engine-wasm.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guide rendering and links
        run: node --test tests/site-guide.test.mjs tests/site-calc.test.mjs
      - name: Build static website and local help
        run: node scripts/build-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

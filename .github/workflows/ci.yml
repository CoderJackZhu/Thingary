name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Keep npm script wildcards consistent across both platforms.
      npm_config_script_shell: bash
    timeout-minutes: 60
    steps:
      - name: 保留源码 LF 换行
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 类型检查与前端构建
        run: npm run build
      - name: 前端纯逻辑检查
        run: npm run test:ui
      - name: cargo fmt 与 clippy
        run: npm run check
      - name: Rust 测试
        run: npm test

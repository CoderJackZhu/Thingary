name: Release draft assets

# 从标签构建未使用 Developer ID 签名的 macOS DMG 与 Android APK，把安装包和合并后的
# SHA256SUMS.txt 附到 GitHub Release **草稿**。工作流从不发布 Release；公开仍由维护者手动执行。
#
# Android 依赖 T3 的 src-tauri/gen/android 工程与 npm run android:build。工程或签名
# 密钥任一缺失时，该 job 只打印 warning 并跳过，不影响 macOS 产物。
# T3 的 Gradle release 签名配置须读取下列环境变量（名称在本文件与 Gradle 中保持一致）：
#   THINGARY_ANDROID_KEYSTORE / THINGARY_ANDROID_KEYSTORE_PASSWORD
#   THINGARY_ANDROID_KEY_ALIAS / THINGARY_ANDROID_KEY_PASSWORD
# 需要的仓库 secrets：ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、
# ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。密钥文件只写入 runner 临时目录。
#
# Windows 候选包仍由 windows-package.yml 构建并保存为 artifact；本工作流不重复构建
# Windows，草稿中是否附 Windows 安装包由维护者按发布流程决定。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已有标签（例如 v0.0.8），构建并附到同名 Release 草稿
        required: true

permissions:
  contents: read

concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS unsigned DMG
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch locked crates for offline license collection
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the universal app bundle
        run: npm run release
      - name: Package the unsigned DMG and its checksum
        run: sh scripts/make-dmg.sh
      - name: Save the DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android signed APK (skipped without project or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # 与 T3 的 gen/android/app/build.gradle.kts 中 ndkVersion 保持一致；
      # 需要改版本时设置仓库变量 ANDROID_NDK_VERSION，不必改本文件。
      ANDROID_NDK_VERSION: ${{ vars.ANDROID_NDK_VERSION || '27.2.12479018' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Check the Android project and signing secrets
        id: ready
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -d src-tauri/gen/android ] || missing="$missing android-project"
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Android APK skipped; missing:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ready.outputs.ready == 'true'
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.ready.outputs.ready == 'true'
        with:
          workspaces: src-tauri
      - name: Install the Android SDK and NDK
        if: steps.ready.outputs.ready == 'true'
        run: |
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin=$(command -v sdkmanager)
          fi
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      - name: Restore the release keystore into the runner temp directory
        if: steps.ready.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/thingary-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "THINGARY_ANDROID_KEYSTORE=$keystore"
            echo "THINGARY_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "THINGARY_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "THINGARY_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the signed release APK
        if: steps.ready.outputs.ready == 'true'
        run: npm run android:build
      - name: Collect the APK and its checksum
        if: steps.ready.outputs.ready == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/universal/release/*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' ! -name '*unsigned*' | sort | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK was produced under src-tauri/gen/android/app/build/outputs/apk."
            exit 1
          fi
          echo "Using $apk"
          mkdir -p release-android
          cp "$apk" "release-android/Thingary-$version-android.apk"
          (cd release-android && sha256sum "Thingary-$version-android.apk" > SHA256SUMS.txt)
          cat release-android/SHA256SUMS.txt
      - name: Save the APK and checksum
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            release-android/*.apk
            release-android/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Attach assets to a draft release
    needs: [macos, android]
    if: always() && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Build one combined SHA256SUMS.txt
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          : > SHA256SUMS.txt
          for name in *.dmg *.exe *.apk; do
            [ -e "$name" ] && sha256sum "$name" >> SHA256SUMS.txt
          done
          if [ ! -s SHA256SUMS.txt ]; then
            echo "::error::No installer was downloaded; refusing to touch the release."
            exit 1
          fi
          cat SHA256SUMS.txt
      - name: Create or update a DRAFT release (never publish)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to modify it."
              exit 1
            fi
          else
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" --draft --verify-tag --title "物谱 ${TAG#v}" --notes-file "$notes"
            else
              gh release create "$TAG" --draft --verify-tag --title "物谱 ${TAG#v}" --generate-notes
            fi
          fi
          gh release upload "$TAG" release-assets/* --clobber
          echo "Attached $(ls release-assets | wc -l) files to the draft release $TAG; it was not published."

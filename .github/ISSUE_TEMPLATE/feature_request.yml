name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先看仓库里 docs/PRODUCT_DESIGN.md 的产品范围：日常流水记账、云同步、AI、按量成本模式等不在范围内。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和痛点，再说方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: textarea
    id: alt
    attributes:
      label: 现在是怎么凑合的

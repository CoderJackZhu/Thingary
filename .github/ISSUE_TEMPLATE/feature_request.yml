name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先看仓库里 docs/PRODUCT_RULES.md 的产品范围与 docs/QUICKSTART.md 的已知限制；不在当前范围内的方向，请先说明现有做法为什么不够用。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景和痛点，再说方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: textarea
    id: alt
    attributes:
      label: 现在是怎么凑合的

name: 缺陷报告
description: 应用行为不符合预期
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、看到了什么、期望看到什么。请不要粘贴真实的个人资料。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如果只在特定状态出现（空白资料、未知金额、读取失败等），也请写出来。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 物谱版本
      description: 「设置 › 关于与帮助」里可以看到；自行构建的写提交号即可。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统、版本与芯片
      placeholder: 例如 macOS 27 / Apple Silicon；Windows 11 x64；Android 15；iOS 26 自行构建
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: 资料安全
      options:
        - label: 我已确认这不是资料丢失或损坏；若是，我已先保留现有资料和备份，再来报告

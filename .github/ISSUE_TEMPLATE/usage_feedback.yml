name: 使用反馈
description: 用过之后的感受：以前用什么、第二次盘点有没有回来、会不会推荐
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        谢谢愿意说说使用感受。三个问题都可以简短回答，没有的写「没有」就行。
        **请遮住或不要写真实金额、账户号、姓名；不要上传数据库或备份文件。** 遇到具体错误请改用「缺陷报告」模板。
  - type: dropdown
    id: system
    attributes:
      label: 你用的系统
      options:
        - Mac（Apple Silicon）
        - Mac（Intel）
        - Windows 11
        - Windows 10
        - Android
        - iOS（自行构建）
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 在「设置 › 关于与帮助」里能看到；自行构建的写提交号即可。
      placeholder: 0.0.8
  - type: textarea
    id: previous
    attributes:
      label: 你以前用什么
      description: 表格、记账 App、备忘录，还是第一次认真整理？哪里比物谱顺手，哪里更麻烦？
    validations:
      required: true
  - type: dropdown
    id: returned
    attributes:
      label: 第二次盘点你回来了吗
      options:
        - 回来了，并继续盘点
        - 回来了，但没有继续
        - 还没有第二次盘点
        - 第一次盘点就没完成
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么没回来（或第二次体验如何）
      description: 如果没回来，是什么挡住了？忘了、步骤太多、结论看不懂、换了工具……一句话也可以。
  - type: textarea
    id: recommend
    attributes:
      label: 什么会让你推荐给别人
      description: 哪一点最值得告诉朋友？或者什么情况下你不会推荐？
  - type: checkboxes
    id: follow-up
    attributes:
      label: 可以追问吗
      options:
        - label: 我愿意在这个 issue 下回答进一步的问题
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有在这里写真实金额、账户号，也没有上传数据库或备份文件
          required: true

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物志 · 综合回顾设计对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222732;font:14px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1340px;margin:auto;padding:28px}h1{font-size:25px;letter-spacing:-.6px;margin:0 0 8px}p{color:#667080;line-height:1.8}nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,select,a.action{font:inherit;background:#fff;border:1px solid #dce0e6;border-radius:7px;padding:8px 12px;color:inherit;text-decoration:none}button{cursor:pointer}button[aria-pressed=true]{color:#304dab;border-color:#8394cf;background:#edf1ff}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #dce0e6;border-radius:9px;background:white}figcaption{margin-top:12px;color:#657080;font-size:12px}.notes{padding:15px 20px;background:white;border:1px solid #dce0e6;border-radius:9px;margin-top:20px}.notes p{margin:5px 0}a{color:#3555ad}button:focus-visible,select:focus-visible{outline:2px solid #3555ad;outline-offset:2px}
</style><main><h1>物志 · 综合回顾</h1><p>在总览内切换实物概览与综合回顾，分别看清盘点时的财富、今天的持有物、已记录支出与固定负担。</p><nav aria-label="对照设置"><button id="after" aria-pressed="true">综合回顾方案</button><button id="before" aria-pressed="false">现有实物总览</button><select id="theme" aria-label="外观"><option value="light">浅色</option><option value="dark">深色</option></select><select id="state" aria-label="状态"><option value="after">正常</option><option value="missing">不完整盘点</option><option value="empty">空白</option><option value="error">局部读取失败</option><option value="1080">1080 × 760</option><option value="800">800 × 600</option><option value="lower">下方内容</option></select><a class="action" id="interactive" href="preview.html?theme=light">打开交互稿</a></nav><figure><a id="full" href="after-light.jpg"><img id="shot" src="after-light.jpg" alt="综合回顾浅色设计稿"></a><figcaption id="caption">1280 × 820 · 点击图片查看原尺寸</figcaption></figure><section class="notes"><p>本页为待确认设计稿，数字均来自虚构样例。现有总览复用当前组件，补充浏览器缺失的只读样例数据；不是原生 App 验收。</p><p>交互稿可切换视图、模拟读取重试及查看跳转提示。实际记录定位、保存、年份与时间轴完整联动将在确认设计后实现。</p><p>小窗口支持滚动；800 × 600 改为单列。截图与布局检查不代表 VoiceOver 或原生快捷键已验收。</p></section></main><script>
let mode='after';const q=id=>document.getElementById(id);function update(){let state=mode==='before'?'before':q('state').value,theme=q('theme').value,file=`${state}-${theme}.jpg`;q('shot').src=file;q('full').href=file;q('shot').alt=`${mode==='before'?'现有实物总览':'综合回顾'} · ${state} · ${theme==='light'?'浅色':'深色'}`;q('caption').textContent=(state==='1080'?'1080 × 760':state==='800'?'800 × 600':'1280 × 820')+' · 点击图片查看原尺寸';q('state').disabled=mode==='before';q('after').setAttribute('aria-pressed',String(mode==='after'));q('before').setAttribute('aria-pressed',String(mode==='before'));q('interactive').href=`preview.html?theme=${theme}&mock=${mode==='before'?'before':['missing','empty','error'].includes(state)?state:'normal'}`;}q('after').onclick=()=>{mode='after';update()};q('before').onclick=()=>{mode='before';update()};q('theme').onchange=update;q('state').onchange=update;
</script></html>

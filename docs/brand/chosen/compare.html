<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:20px;background:#f2f2f5;font:13px -apple-system,'PingFang SC',sans-serif;min-width:1180px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}section{background:#fff;border-radius:16px;padding:14px}h3{margin:0 0 8px;font-size:14px}p{color:#666;font-size:12px;margin:10px 0 4px}
.sz{display:flex;gap:10px;align-items:flex-end;border-radius:10px;padding:8px;margin-top:8px;background:#eee}.dark{background:#1c1c1e}
.px{display:flex;gap:16px;align-items:flex-end}canvas{image-rendering:pixelated;background:#fff;border:1px solid #ddd}</style>
<div class="g"><section><h3>原版（OD 第一轮 01）</h3><img src="staff-orig.svg" width="300"/>
<div class="sz dark"><img src="staff-orig.svg" width="128"/><img src="staff-orig.svg" width="64"/><img src="staff-orig.svg" width="32"/><img src="staff-orig.svg" width="16"/></div>
<div class="sz"><img src="staff-orig.svg" width="128"/><img src="staff-orig.svg" width="64"/><img src="staff-orig.svg" width="32"/><img src="staff-orig.svg" width="16"/></div>
<p>像素放大（真实 32 px 与 16 px 渲染后放大 6 倍）</p>
<div class="px"><canvas data-src="staff-orig.svg" data-n="32"></canvas><canvas data-src="staff-orig.svg" data-n="16"></canvas></div></section><section><h3>放松五线（主图）</h3><img src="staff-relaxed-5.svg" width="300"/>
<div class="sz dark"><img src="staff-relaxed-5.svg" width="128"/><img src="staff-relaxed-5.svg" width="64"/><img src="staff-relaxed-5.svg" width="32"/><img src="staff-relaxed-5.svg" width="16"/></div>
<div class="sz"><img src="staff-relaxed-5.svg" width="128"/><img src="staff-relaxed-5.svg" width="64"/><img src="staff-relaxed-5.svg" width="32"/><img src="staff-relaxed-5.svg" width="16"/></div>
<p>像素放大（真实 32 px 与 16 px 渲染后放大 6 倍）</p>
<div class="px"><canvas data-src="staff-relaxed-5.svg" data-n="32"></canvas><canvas data-src="staff-relaxed-5.svg" data-n="16"></canvas></div></section><section><h3>小尺寸三线（≤64 px）</h3><img src="staff-small-3.svg" width="300"/>
<div class="sz dark"><img src="staff-small-3.svg" width="128"/><img src="staff-small-3.svg" width="64"/><img src="staff-small-3.svg" width="32"/><img src="staff-small-3.svg" width="16"/></div>
<div class="sz"><img src="staff-small-3.svg" width="128"/><img src="staff-small-3.svg" width="64"/><img src="staff-small-3.svg" width="32"/><img src="staff-small-3.svg" width="16"/></div>
<p>像素放大（真实 32 px 与 16 px 渲染后放大 6 倍）</p>
<div class="px"><canvas data-src="staff-small-3.svg" data-n="32"></canvas><canvas data-src="staff-small-3.svg" data-n="16"></canvas></div></section></div>
<script>
document.querySelectorAll('canvas').forEach(c=>{const n=+c.dataset.n,img=new Image();img.onload=()=>{c.width=n;c.height=n;const x=c.getContext('2d');x.drawImage(img,0,0,n,n);c.style.width=n*6+'px';c.style.height=n*6+'px'};img.src=c.dataset.src});
</script>
